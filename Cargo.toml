[package]
name = "wallpaper-studio-ui"
version = "0.1.0"
edition = "2024"
description = "Browser editor for bgsvg configs -- a server, not a bundle"

[dependencies]
askama = "0.16"
# The renderer, and the only pin there is: Cargo.lock names the revision.
# Adopt a newer one with `cargo update -p bgsvg`, then refresh
# cargoLock.outputHashes in flake.nix -- nix build prints the value it wanted.
bgsvg = { git = "https://github.com/M4jor-Tom/wallpaper.studio.svg.git" }
form_urlencoded = "1"
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
# only for the drift test, which decodes bgsvg::params::DESCRIPTOR. Both are
# already compiled as part of bgsvg itself.
prost = "0.14"
prost-types = "0.14"
