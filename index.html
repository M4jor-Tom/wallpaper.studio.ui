<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>bgsvg studio</title>
  </head>
  <body>
    <div id="stage"><img id="preview" alt="" /></div>
    <div id="dock">
      <header>
        <h1>bgsvg studio</h1>
        <button id="theme-toggle" type="button"></button>
      </header>
      <main>
        <p id="error" role="alert" hidden></p>
        <section id="controls" aria-label="Configuration"></section>
        <section id="export" aria-label="Export">
          <div class="row">
            <label for="res">Resolution</label>
            <select id="res"></select>
          </div>
          <div class="row">
            <label for="res-custom">Custom size</label>
            <input type="text" id="res-custom" placeholder="WIDTHxHEIGHT" autocomplete="off" />
          </div>
          <div class="row export-buttons">
            <button id="dl-svg" type="button">Download SVG</button>
            <button id="copy-json" type="button" aria-live="polite">Copy JSON</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
